# Self-hosting stack for the FishMem OSS edition.
#
#   docker compose up -d web task-worker docs  # complete app + extraction + docs
#   docker compose up -d postgres   # just pgvector (for the embedded library)
#
# The Cloudflare-backed Cloud/EE edition deploys separately (wrangler) and does
# not use this file. See DEPLOY.md.

services:
  # Postgres with the pgvector extension — the database for self-hosted fishmem
  # (the library's PgVectorStore + Postgres graph store). The control-plane
  # dashboard currently uses the verified libSQL path below.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fishmem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fishmem
    ports:
      - "5432:5432"
    volumes:
      - fishmem-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishmem"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Documentation site (Fumadocs static export, served by nginx).
  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    ports:
      - "8080:80"

  # OSS dashboard on Node + libSQL (embedded SQLite in a volume — the verified
  # self-host path). The container applies committed SQL migrations, then serves
  # the built application through a production Node HTTP server.
  web:
    image: fishmem-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      FISHMEM_RUNTIME: node
      FISHMEM_DB: libsql
      DATABASE_URL: file:/data/fishmem.db
      FISHMEM_ASSET_DIR: /data/assets
      FISHMEM_EXTRACTOR_URL: http://extractor:5001
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      FISHMEM_SETUP_TOKEN: ${FISHMEM_SETUP_TOKEN:?Set FISHMEM_SETUP_TOKEN in .env}
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - fishmem-webdata:/data
    depends_on:
      - extractor

  # CPU-only Docling v1.21.0. Cloudflare Containers build this same Dockerfile,
  # so extraction semantics and artifact versioning stay identical.
  extractor:
    build:
      context: apps/web/services/extractor
      dockerfile: Dockerfile
    expose:
      - "5001"

  # Durable Node task pickup. It calls the existing authenticated cron handler;
  # the database remains the only retry/status source.
  task-worker:
    image: fishmem-web:local
    command: ["node", "scripts/poll-tasks.mjs"]
    environment:
      FISHMEM_TASK_WORKER_BASE_URL: http://web:3000
      FISHMEM_TASK_POLL_MS: 2000
      FISHMEM_MAINTENANCE_MS: 86400000
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
    depends_on:
      - web

volumes:
  fishmem-pgdata:
  fishmem-webdata:
