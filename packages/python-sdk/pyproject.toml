[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fishmem"
version = "0.1.0"
description = "Official Python SDK for FishMem Cloud and self-hosted FishMem"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "FishMem" }]
keywords = ["fishmem", "memory", "ai", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Documentation = "https://docs.fishmem.com/sdk/python"
Repository = "https://github.com/fishmem-labs/fishmem"
Issues = "https://github.com/fishmem-labs/fishmem/issues"
Changelog = "https://docs.fishmem.com/release-notes"

[tool.hatch.build.targets.wheel]
packages = ["src/fishmem"]

[tool.hatch.build.targets.sdist]
exclude = ["/.gitignore", "/package.json", "/uv.lock"]
