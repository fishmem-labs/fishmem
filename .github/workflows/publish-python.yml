name: Publish Python SDK

on:
  workflow_dispatch:
  push:
    tags:
      - "python-v*"

concurrency:
  group: publish-python-pypi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build signed source inputs
    if: >-
      github.event_name == 'push' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release ref
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("packages/python-sdk/pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]

          if os.environ["GITHUB_EVENT_NAME"] == "push":
              expected = f"python-v{version}"
              actual = os.environ["GITHUB_REF_NAME"]
              if actual != expected:
                  raise SystemExit(f"release tag must be {expected}, got {actual}")
          PY

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build packages/python-sdk --outdir dist
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish fishmem to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fishmem
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
