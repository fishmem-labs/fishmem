name: Publish npm packages

on:
  workflow_dispatch:
  push:
    tags:
      - "npm-v*"

concurrency:
  group: publish-fishmem-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and inspect npm packages
    if: >-
      github.event_name == 'push' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Verify release versions
        run: |
          pnpm check:versions
          node <<'NODE'
          const core = require("./packages/fishmem/package.json");
          const sdk = require("./packages/sdk/package.json");
          if (core.version !== sdk.version) {
            throw new Error(`package versions differ: ${core.version} and ${sdk.version}`);
          }
          if (process.env.GITHUB_EVENT_NAME === "push") {
            const expected = `npm-v${core.version}`;
            if (process.env.GITHUB_REF_NAME !== expected) {
              throw new Error(`release tag must be ${expected}`);
            }
          }
          NODE

      - name: Test and build public packages
        run: |
          pnpm --filter fishmem typecheck
          pnpm --filter fishmem test
          pnpm --filter fishmem build
          pnpm --filter @fishmem/sdk typecheck
          pnpm --filter @fishmem/sdk test
          pnpm --filter @fishmem/sdk build

      - name: Pack and verify installable artifacts
        run: |
          pack_dir="$(mktemp -d)"
          install_dir="$(mktemp -d)"
          pnpm --dir packages/fishmem pack --pack-destination "$pack_dir"
          pnpm --dir packages/sdk pack --pack-destination "$pack_dir"
          core_tarball="$(find "$pack_dir" -maxdepth 1 -name 'fishmem-[0-9]*.tgz' -print -quit)"
          sdk_tarball="$(find "$pack_dir" -maxdepth 1 -name 'fishmem-sdk-[0-9]*.tgz' -print -quit)"
          test -n "$core_tarball"
          test -n "$sdk_tarball"
          npm install --prefix "$install_dir" \
            "$core_tarball" \
            "$sdk_tarball"
          cd "$install_dir"
          node --input-type=module -e \
            "import * as core from 'fishmem'; import { FishMem } from '@fishmem/sdk'; if (!core.Memory || !new FishMem({ apiKey: 'test' }).memories) process.exit(1)"
          mkdir -p "$GITHUB_WORKSPACE/dist/npm"
          cp "$core_tarball" "$GITHUB_WORKSPACE/dist/npm/fishmem-core.tgz"
          cp "$sdk_tarball" "$GITHUB_WORKSPACE/dist/npm/fishmem-sdk.tgz"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-distributions
          path: dist/npm/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Stage fishmem and @fishmem/sdk
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/fishmem
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - name: Install the trusted-publishing npm CLI
        run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-package-distributions
          path: dist/npm/
      - name: Stage both packages with npm provenance
        run: |
          npm stage publish dist/npm/fishmem-core.tgz --access public --provenance
          npm stage publish dist/npm/fishmem-sdk.tgz --access public --provenance
